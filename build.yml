name: Build MUSLIM MR APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: No ZIP file found in this repository.'
            echo 'Files currently present:'
            find . -maxdepth 4 -type f -print
            exit 1
          fi
          echo "Found project archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          echo 'Project files after extraction:'
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MUSLIM-MR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
